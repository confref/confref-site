# nginx on bart: /etc/nginx/sites-available/confref, linked into sites-enabled (decision 0015 of confref-data).
# This is the version before certbot: `certbot --nginx` adds the 443 parts and the http -> https redirects to the
# copy on the server, so the server's copy differs from this one by the lines marked "managed by Certbot".
#
#   www.confref.org      the site (this repository), root /home/eckert/www.confref.org/
#   confref.org          redirects to www.confref.org, keeping the path
#   archive.confref.org  the dumps: /store/<slug>/<version>/<path> = lokal/store, root /home/eckert/archive.confref.org/;
#                        no directory listing
#   labs.confref.org, id.confref.org
#                        reverse proxy to the platform VM (confref-platform), while its ports are closed to the outside

server {
    listen 80;
    listen [::]:80;
    server_name www.confref.org;

    root /home/eckert/www.confref.org/;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name confref.org;

    return 301 https://www.confref.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name archive.confref.org;

    root /home/eckert/archive.confref.org/;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# labs.confref.org and id.confref.org: the platform VM (confref-platform, 141.19.143.23), behind this server as a
# reverse proxy. TLS ends here (certbot); the connection to the VM is encrypted again and checked against the VM's
# self-signed certificate (/etc/nginx/confref-platform.pem, a copy of its /etc/nginx/tls-confref/fullchain.pem).
# The VM accepts http and https only from this server and takes the client address from X-Forwarded-For
# (confref-platform host/install.sh, PROXY=141.19.143.20).
upstream confref_platform {
    server 141.19.143.23:443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name labs.confref.org id.confref.org;

    access_log /var/log/nginx/confref-platform.access.log;
    client_max_body_size 2m;                    # the reconciliation API (POST)

    location / {
        proxy_pass https://confref_platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # replaced, not appended: clients cannot set it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/confref-platform.pem;
        proxy_ssl_session_reuse on;
        proxy_read_timeout 140s;                # SPARQL queries: 130 s on the VM
    }
}
