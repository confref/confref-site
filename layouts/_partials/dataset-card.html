{{ $f := partial "dataset-figures.html" . }}
<a class="card" href="{{ .RelPermalink }}">
  <h3>{{ .Title }}</h3>
  <p>{{ .Summary | plainify | truncate 140 }}</p>
  <div class="chips">
    <span class="chip teal">{{ .Params.kind }}</span>
    {{ with .Params.license }}<span class="chip">{{ .name }}</span>{{ end }}
    {{ with $f.triples }}<span class="chip">{{ lang.FormatNumber 0 . }} triples</span>{{ end }}
  </div>
</a>
