{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    {{ with .Params.eyebrow }}<div class="eyebrow">{{ . }}</div>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
    {{ if eq .Section "news" }}<p class="muted"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}
  </header>
  <article class="prose">{{ .Content }}</article>
</div>
{{ end }}
